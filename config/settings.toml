# Non-secret configuration. Secrets come from env (.env). See config.py.

[defaults]
output_lang = "ru"        # newspaper language; sources stay multilingual
theme = "times-classic"
page_format = "a4"
spreads = 2               # количество разворотов в выпуске (1 разворот = 2 полосы)

[models]
tagging = "claude-haiku-4-5"
summarize = "claude-sonnet-4-6"
editorial = "claude-opus-4-8"

[llm]
use_batch = true          # Batch API (-50%) for the nightly run
use_prompt_cache = true   # cache stable system-prompt prefixes (-90% on cache reads)

[embeddings]
provider = "voyage"
model = "voyage-3.5"      # multilingual
semantic_weight = 0.6     # ranking blend: 0 = keywords only, 1 = embeddings only

[retrieval]
max_candidates = 300
final_stories = 30
gdelt_enabled = true      # multilingual candidate retrieval via GDELT (no key needed)
gdelt_timespan = "1d"     # lookback window
gdelt_max_records = 75
source_langs = []         # empty = every language; e.g. ["English","Russian"] to restrict
