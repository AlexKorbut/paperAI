<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 140" role="img" aria-label="The Morning Paper">
  <!-- Ornamental thick-thin-thin rule at top -->
  <g fill="#241a0d">
    <rect x="0" y="2" width="900" height="3"/>
    <rect x="0" y="8" width="900" height="1"/>
  </g>

  <!-- Engraved corner flourishes -->
  <g fill="#5a3210">
    <path d="M8,18 q14,0 14,14 q0,-9 9,-9 q-9,0 -9,-9 q0,9 -14,4 Z"/>
    <path d="M892,18 q-14,0 -14,14 q0,-9 -9,-9 q9,0 9,-9 q0,9 14,4 Z"/>
  </g>

  <!-- Blackletter masthead title -->
  <text x="450" y="92"
        text-anchor="middle"
        font-family="'UnifrakturCook', 'Playfair Display', Georgia, serif"
        font-size="72"
        font-weight="700"
        fill="#241a0d"
        letter-spacing="1">The Morning Paper</text>

  <!-- Latin motto between small rules -->
  <g fill="#5a3210">
    <rect x="300" y="106" width="120" height="0.8"/>
    <rect x="480" y="106" width="120" height="0.8"/>
    <polygon points="436,106.4 450,101 464,106.4 450,111.8"/>
  </g>
  <text x="450" y="123"
        text-anchor="middle"
        font-family="'IM Fell English', Georgia, serif"
        font-size="11"
        font-style="italic"
        letter-spacing="3"
        fill="#241a0d">EX TENEBRIS LUX &#183; PRINTED DAILY</text>

  <!-- Ornamental thin-thin-thick rule at bottom -->
  <g fill="#241a0d">
    <rect x="0" y="131" width="900" height="1"/>
    <rect x="0" y="135" width="900" height="3"/>
  </g>
</svg>
