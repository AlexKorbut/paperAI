<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 232" role="img" aria-label="Вѣдомости — Москва, 1703">
  <!-- Гравированная толсто-тонкая линейка сверху -->
  <g fill="#241c10">
    <rect x="0" y="2" width="900" height="2.6"/>
    <rect x="0" y="8" width="900" height="0.8"/>
  </g>

  <!-- Год (слева) и номер (справа) -->
  <text x="16" y="40" font-family="'Cormorant Garamond', Georgia, serif"
        font-size="17" letter-spacing="2" fill="#6b4a23">1703</text>
  <text x="884" y="40" text-anchor="end" font-family="'Cormorant Garamond', Georgia, serif"
        font-size="17" letter-spacing="1" fill="#6b4a23">№ 2.</text>

  <!-- Гравированный двуглавый орёл (симметрия отражением правой половины) -->
  <g fill="#241c10" stroke="#241c10" stroke-width="0.6">
    <!-- Императорская корона над центром -->
    <g transform="translate(450,0)">
      <path d="M -22 28 Q -11 14 0 26 Q 11 14 22 28 L 18 34 L -18 34 Z"/>
      <circle cx="-22" cy="27" r="3"/><circle cx="0" cy="23" r="3"/><circle cx="22" cy="27" r="3"/>
      <rect x="-1.4" y="13" width="2.8" height="9"/>
      <rect x="-5" y="16.5" width="10" height="2.4"/>
      <rect x="-13" y="34" width="26" height="3.2"/>
    </g>
    <!-- Тело-щит по центру -->
    <path d="M 450 44 Q 470 60 466 92 Q 458 104 450 110 Q 442 104 434 92 Q 430 60 450 44 Z"
          fill="#e7dec2" stroke="#241c10" stroke-width="1.1"/>
    <!-- Правая голова + клюв + крыло; левая — зеркало -->
    <g id="half">
      <ellipse cx="479" cy="50" rx="12" ry="9.5"/>
      <path d="M 490 48 L 506 45 L 506 49 L 491 53 Z"/>
      <circle cx="481" cy="48.5" r="1.6" fill="#e7dec2" stroke="none"/>
      <!-- крыло с перьями-фестонами -->
      <path d="M 460 58
               Q 492 56 520 70
               Q 540 80 548 100
               Q 532 92 520 92
               Q 528 100 524 112
               Q 512 102 502 102
               Q 508 112 502 122
               Q 488 110 476 104
               Q 466 84 460 58 Z"/>
      <!-- лапа со сферой (держава) -->
      <path d="M 458 104 Q 470 110 476 118" fill="none" stroke-width="1.4"/>
      <circle cx="486" cy="124" r="7" fill="#e7dec2" stroke="#241c10" stroke-width="1.1"/>
      <path d="M 486 117 v 14 M 479 124 h 14" stroke="#241c10" stroke-width="0.9"/>
    </g>
    <use href="#half" transform="translate(900,0) scale(-1,1)"/>
    <!-- Хвост-веер -->
    <path d="M 438 110 L 450 150 L 462 110 Q 450 120 438 110 Z"/>
    <path d="M 444 116 L 450 146 L 456 116" fill="none" stroke="#e7dec2" stroke-width="0.7"/>
  </g>

  <!-- Титул гражданским шрифтом -->
  <text x="450" y="190" text-anchor="middle"
        font-family="'Cormorant Garamond', Georgia, serif"
        font-size="58" font-weight="700" letter-spacing="6" fill="#241c10">ВѢДОМОСТИ</text>

  <!-- Подзаголовок курсивом -->
  <text x="450" y="214" text-anchor="middle"
        font-family="'Cormorant Garamond', Georgia, serif"
        font-size="15" font-style="italic" letter-spacing="1" fill="#241c10">о воинскихъ и иныхъ дѣлахъ, достойныхъ знанія и памяти</text>

  <!-- Гравированная тонко-толстая линейка снизу -->
  <g fill="#241c10">
    <rect x="0" y="222" width="900" height="0.8"/>
    <rect x="0" y="227" width="900" height="2.6"/>
  </g>
</svg>
