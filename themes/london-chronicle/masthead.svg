<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 206" role="img" aria-label="The London Chronicle; or, Universal Evening Post">
  <!-- Engraved thick-thin rule at the top -->
  <g fill="#211c12">
    <rect x="0" y="3" width="900" height="2.6"/>
    <rect x="0" y="9" width="900" height="0.8"/>
  </g>

  <!-- Volume (left) and number (right) flanking the title -->
  <text x="16" y="42" font-family="'IM Fell English', Georgia, serif"
        font-size="16" letter-spacing="2" fill="#3a2c14">VOL VI</text>
  <text x="884" y="42" text-anchor="end" font-family="'IM Fell English', Georgia, serif"
        font-size="16" letter-spacing="1" fill="#3a2c14">N&#186; 437.</text>

  <!-- Engraved roman titling -->
  <text x="450" y="108" text-anchor="middle"
        font-family="'IM Fell English', Georgia, serif"
        font-size="68" letter-spacing="1.5" fill="#211c12">The London Chronicle</text>

  <!-- Conjunction -->
  <text x="450" y="136" text-anchor="middle"
        font-family="'IM Fell English', Georgia, serif"
        font-size="16" font-style="italic" letter-spacing="2" fill="#211c12">OR,</text>

  <!-- Subtitle in spaced capitals -->
  <text x="450" y="172" text-anchor="middle"
        font-family="'IM Fell English', Georgia, serif"
        font-size="33" letter-spacing="5" fill="#211c12">UNIVERSAL EVENING POST.</text>

  <!-- Engraved thin-thick rule at the bottom -->
  <g fill="#211c12">
    <rect x="0" y="194" width="900" height="0.8"/>
    <rect x="0" y="199" width="900" height="2.6"/>
  </g>
</svg>
