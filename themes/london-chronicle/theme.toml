schema_version = 1
id            = "london-chronicle"
display_name  = "The London Chronicle — 1759 Evening Post"
mood          = "Georgian evening broadsheet: ornate engraved masthead, three dense justified Caslon columns, hairline rules, small-caps section heads, a single engraved drop cap, aged laid paper"

[format]
page        = "a4"
orientation = "portrait"
bleed_mm    = 0
color_mode  = "bw"
layout      = "columns"

[grid]
columns       = 3
rule_weight   = "0.5px"
gutter        = "6mm"
section_order = ["gazette", "london", "foreign", "ship", "bankrupts"]
max_lead      = 1

[type]
masthead_font = "IM Fell English"
headline_font = "IM Fell English"
body_font     = "IM Fell English"
scale         = "classic"
hyphenate     = true
# Larger than the ~7pt 1759 original — readable while keeping the dense look.
body_pt       = 11.5
leading       = 1.3

[colors]
paper  = "#e9e0c8"
ink    = "#211c12"
accent = "#3a2c14"

[photo]
treatment    = "bw"
max_width_px = 1400

[[fonts]]
family  = "IM Fell English"
files   = ["fonts/IMFellEnglish-Regular.woff2", "fonts/IMFellEnglish-Italic.woff2"]
license = "OFL-1.1"

[assets]
masthead = "masthead.svg"
